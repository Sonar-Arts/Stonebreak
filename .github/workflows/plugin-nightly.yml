# Rolling "nightly" release of Stonebreak's Open Mason plugin (openmason-plugin-stonebreak, #382).
#
# Runs when `build` succeeds on a push to main and republishes the drop-in plugin jar that run
# uploaded (build.yml's "Stage the plugin for the nightly"), but only if something the plugin ships
# changed since the commit the current nightly was made from (PLUGIN_PATHS below). Nothing is rebuilt.
#
# The release is the tag `nightly`, moved to the built commit each time, marked a prerelease. The
# asset name never changes, so this URL always serves the newest build:
#   .../releases/download/nightly/openmason-plugin-stonebreak-nightly.jar
# Users drop it into Open Mason's plugin folder (Preferences > Plugins shows where; see the notes).
#
# A new Open Mason snapshot alone does not make a new nightly: only a push to main that changes
# PLUGIN_PATHS does (the nightly then picks up whatever snapshot that build fetched).
name: plugin-nightly

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: write   # move the `nightly` tag, replace the release
  actions: read     # download the triggering build's artifact

# One at a time, in order; an older build finishing late is skipped by the ancestry check below.
concurrency:
  group: plugin-nightly
  cancel-in-progress: false

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  # What the nightly ships: the plugin, the game it bundles (registries, SBO data, UI host), the
  # build that assembles them.
  PLUGIN_PATHS: >-
    openmason-plugin-stonebreak
    stonebreak-game/src/main
    stonebreak-game/pom.xml
    pom.xml

jobs:
  nightly:
    # Only a successful build of a push to main in THIS repo: workflow_run runs with this workflow's
    # write permissions, so a fork's run (whose branch may also be called main) must never get here.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0   # history + tags for the change check and the notes

      - name: Did the plugin change?
        id: changes
        run: |
          last=$(git rev-parse -q --verify "refs/tags/nightly^{commit}" || true)
          if [[ -z "$last" ]]; then
            echo "No nightly yet: publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$HEAD_SHA" "$last"; then
            echo "The nightly ($last) already includes $HEAD_SHA: skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git merge-base --is-ancestor "$last" "$HEAD_SHA"; then
            echo "The nightly's commit $last is not in main's history (rewritten?): publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # PLUGIN_PATHS is space-separated on purpose (word-split into pathspecs).
          changed=$(git diff --name-only "$last" "$HEAD_SHA" -- $PLUGIN_PATHS)
          if [[ -z "$changed" ]]; then
            echo "Nothing the plugin ships changed since $last: skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$changed" | head -n 50
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        if: steps.changes.outputs.publish == 'true'
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: plugin-dropin
          path: plugin-stage

      - name: Staged
        if: steps.changes.outputs.publish == 'true'
        run: |
          ls -la plugin-stage
          for f in openmason-plugin-stonebreak-nightly.jar openmason-version.txt; do
            [[ -f "plugin-stage/$f" ]] || { echo "::error::build run ${{ github.event.workflow_run.id }} did not upload $f"; exit 1; }
          done

      - name: Publish the nightly
        if: steps.changes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST: ${{ steps.changes.outputs.last }}
        run: |
          om=$(sed -n 1p plugin-stage/openmason-version.txt)
          resolved=$(sed -n 2p plugin-stage/openmason-version.txt)
          rm plugin-stage/openmason-version.txt
          short=${HEAD_SHA::7}
          {
            echo "Nightly build of the Stonebreak plugin for Open Mason from [\`$short\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$HEAD_SHA), built against Open Mason \`$resolved\`."
            echo
            echo "To install, copy \`openmason-plugin-stonebreak-nightly.jar\` into Open Mason's plugins folder and restart."
            echo "Preferences > Plugins shows where the folder is. Set your Stonebreak checkout under Preferences > Stonebreak."
            if [[ -n "$LAST" ]]; then
              echo
              echo "### Changes"
              git log --no-merges --format='- %s (%h)' "$LAST..$HEAD_SHA" -- $PLUGIN_PATHS | head -n 40
            fi
          } > notes.md
          cat notes.md

          # Replace the release (keeps its URL; the date shows when it was rebuilt), then move the tag.
          gh release delete nightly --yes 2>/dev/null || true
          git tag -f nightly "$HEAD_SHA"
          git push -f origin refs/tags/nightly
          gh release create nightly --verify-tag --prerelease \
            --title "Open Mason Stonebreak plugin (nightly $short)" --notes-file notes.md \
            plugin-stage/openmason-plugin-stonebreak-nightly.jar
