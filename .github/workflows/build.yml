# Compiles and packages the reactor (stonebreak-game, the Open Mason plugin, the worldgen glue) on every
# supported platform, so a change that breaks the build on one OS shows up before merge.
# Build only: tests are compiled but not run (the test harness is Testing/run-tests.sh), and the
# shaded jars are not uploaded or released. The root POM's OS-activated profiles pick the
# LWJGL/Skija natives for each runner.
#
# Open Mason (the engine and the tool) comes from GitHub Packages at the root POM's openmason.version
# (#388; for now a snapshot following OpenMason main, so every mvn call here passes -U to fetch the
# newest one and the jars and the Cenda SDK come from the same publish); its engine-core jar already carries every platform's Cenda library, so the shaded game jar
# gets it from there, and this job fails if it does not (UI scripting and layout have no Java
# fallback). Stonebreak's own worldgen library (stonebreak-game/native, #386) is built here against
# the Open Mason Cenda SDK of the same version and packaged into the game jar; it has a Java
# fallback, but a release without it generates on the slow path, so the job checks it too.
#
# Reading GitHub Packages needs a token even for public packages: the workflow token, or the
# OPENMASON_PACKAGES_TOKEN secret (a read:packages token) if the workflow token is refused.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Dev Working/**"
      - ".github/ISSUE_TEMPLATE/**"
  # No paths-ignore on PRs: the build jobs are required status checks on main, and a skipped
  # workflow never reports, which would leave docs-only PRs blocked forever.
  pull_request:
  workflow_dispatch:

# Checkout + build only: the job never writes to the repo, issues or packages.
permissions:
  contents: read
  packages: read

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (natives-macos-arm64 profile); macos-13 is the last
        # Intel image, so add it here if the x86_64 natives need coverage too.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Unpack the Open Mason Cenda SDK
        env:
          GITHUB_TOKEN: ${{ secrets.OPENMASON_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp -U -s .mvn/settings.xml -f stonebreak-game/native/pom.xml initialize

      - name: Configure Stonebreak worldgen natives (release)
        working-directory: stonebreak-game/native
        run: >
          cmake --preset release
          -DFETCHCONTENT_BASE_DIR="${{ runner.temp }}/stonebreak-native-deps"
          -DBUILD_TESTING=OFF

      - name: Build Stonebreak worldgen natives
        working-directory: stonebreak-game/native
        run: cmake --build --preset release --parallel

      - name: Build Stonebreak + the Open Mason plugin
        # -DskipTests still compiles the test sources, so broken tests fail the build.
        env:
          GITHUB_TOKEN: ${{ secrets.OPENMASON_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp -U -s .mvn/settings.xml package -DskipTests

      - name: Verify Cenda + worldgen natives are packaged
        # The Cenda library arrives inside the published engine-core jar; the worldgen library is
        # copied by the game POM, which skips a missing one silently. The platform dir must match
        # cenda.natives.dir.
        run: |
          case "${{ runner.os }}" in
            Linux) os=linux; lib=libcenda_kernels.so ;;
            macOS) os=macos; lib=libcenda_kernels.dylib ;;
            Windows) os=windows; lib=cenda_kernels.dll ;;
          esac
          case "${{ runner.arch }}" in
            X64) arch=x86_64 ;;
            ARM64) arch=aarch64 ;;
            *) echo "::error::unmapped runner arch ${{ runner.arch }}"; exit 1 ;;
          esac
          entry="natives/$os-$arch/$lib"
          status=0
          for jar in stonebreak-game/target/stonebreak-game-*-shaded.jar; do
            case "$jar" in *-sources.jar|*-javadoc.jar|*/original-*) continue ;; esac
            if [[ ! -f "$jar" ]]; then
              echo "::error::expected jar not found: $jar"; status=1
            elif jar tf "$jar" | grep -qx "$entry"; then
              echo "$jar: $entry"
            else
              echo "::error::$jar is missing $entry"; status=1
            fi
          done
          # The game's own worldgen library (#386) rides the game jars only.
          case "${{ runner.os }}" in
            Linux) wlib=libstonebreak_worldgen.so ;;
            macOS) wlib=libstonebreak_worldgen.dylib ;;
            Windows) wlib=stonebreak_worldgen.dll ;;
          esac
          wentry="natives/$os-$arch/$wlib"
          for jar in stonebreak-game/target/stonebreak-game-*-shaded.jar; do
            if jar tf "$jar" | grep -qx "$wentry"; then
              echo "$jar: $wentry"
            else
              echo "::error::$jar is missing $wentry"; status=1
            fi
          done
          exit $status
