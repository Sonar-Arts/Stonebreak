name: Open Mason Bug Report
description: Report an Open Mason engine or toolset bug.
title: "[BUG] [OPEN MASON] "
labels: ["Attention Requested", "Bug", "Engine/dev tools"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Gameplay bugs go in the Stonebreak Bug Report.

  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Open Mason tool (editor UI)
        - Model editing (.omo)
        - Animation editing (.oma)
        - Texture editing (.omt)
        - Block / entity definitions (.sbo / .sbt / .sbe)
        - UI editor (.omui / .sbui)
        - Python scripting
        - Plugins / plugin API
        - Engine (rendering, meshing, networking, etc.)
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Build / version
      description: Release version or commit hash.
      placeholder: e.g. 00c98ea4
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 24H2, macOS 15.1, Ubuntu 24.04

  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: e.g. NVIDIA RTX 3070, driver 566.14
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Java version
      description: Output of `java -version`.
      placeholder: e.g. OpenJDK 25

  - type: textarea
    id: plugins
    attributes:
      label: Plugins
      description: Non-builtin plugins, or "None".

  - type: textarea
    id: logs
    attributes:
      label: Console output
      render: shell

  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: Screenshots, videos, or the file involved (.omo, .sbo, ...). Zip files GitHub rejects.
