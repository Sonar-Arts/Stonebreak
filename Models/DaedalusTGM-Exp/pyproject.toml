[project]
name = "terrain-slm"
version = "0.1.0"
description = "DaedalusTGM-Exp: Stonebreak terrain generation model (controls, relief sampler, planner, synth, flow-matching refiner)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "numpy>=2.0",
    "scipy>=1.14",
    "numba>=0.61",
    "rasterio>=1.4",
    "pyfastnoiselite==0.0.6",
    "matplotlib>=3.9",
    "pillow>=10.0",
    "requests>=2.32",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrain_slm"]
