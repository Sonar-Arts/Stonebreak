[project]
name = "terrain-slm"
version = "0.1.0"
description = "DaedalusTGM-Exp: Stonebreak terrain generation model (controls, relief sampler, planner, synth, flow-matching refiner)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.13",  # >= 2.13: GHSA-rrmf-rvhw-rf47 (torch.jit.script memory corruption)
    "numpy>=2.0",
    "scipy>=1.14",
    "numba>=0.61",
    "rasterio>=1.4",
    "pyfastnoiselite==0.0.6",
    "matplotlib>=3.9",
    "pillow>=13.0",  # >= 13.0: JPEG/TIFF/GIF/EPS/PDF decoder CVEs fixed in 13.0.0 (Dependabot #11-#19)
    "requests>=2.32",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
index-strategy = "unsafe-best-match"
# Transitive floors for security fixes (not direct imports).
constraint-dependencies = [
    "certifi>=2026.10.19",  # emSign roots with compromised intermediates removed (Dependabot #10)
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrain_slm"]
